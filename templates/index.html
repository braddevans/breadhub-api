{% extends "base.html" %}

{% block title %}Home - {{ super() }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 text-center">
        <h1 class="display-4 mb-4">Welcome to {{ site_name }}</h1>
        
        <div class="row g-4 mt-5">
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="text-primary mb-3">
                            <i class="bi bi-upc-scan" style="font-size: 2.5rem;"></i>
                        </div>
                        <h3>Barcode Generator</h3>
                        <p>Generate and customize barcodes in various formats including Code128 and EAN13.</p>
                        <a href="{{ url_for('pages.barcode_generator') }}" class="btn btn-primary">
                            Try Barcode Generator
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Add any page-specific JavaScript here
    document.addEventListener('DOMContentLoaded', function() {
        // Example: Add smooth scrolling to anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });
    });
</script>
{% endblock %}
