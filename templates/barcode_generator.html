{% extends "base.html" %}

{% block title %}Barcode Generator - {{ super() }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <!-- Header -->
    <div class="row mb-4">
        <div class="col-12 d-flex justify-content-between align-items-center">
            <h1 class="h3 m-0"><i class="bi bi-upc-scan me-2"></i>Barcode Generator</h1>
            <div>
                <button class="btn btn-outline-secondary" id="btnReset" title="Reset all fields">
                    <i class="bi bi-arrow-counterclockwise"></i> Reset
                </button>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Left: Inputs + Preview -->
        <div class="col-lg-8">
            <div class="card barcode-card mb-4">
                <div class="card-header">
                    <h5 class="mb-0">Code 128 Barcode</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="barcodeData" class="form-label">Data (any text)</label>
                        <input type="text" class="form-control" id="barcodeData" value="CODE128" autocomplete="off" />
                    </div>
                    <button class="btn btn-primary" id="btnGenerate">Generate</button>
                </div>
            </div>

            <!-- Preview Card -->
            <div class="card barcode-card">
                <div class="card-header d-flex align-items-center justify-content-between">
                    <h5 class="mb-0">Barcode Preview</h5>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-light btn-sm btn-copy" id="copyBarcodeBtn" title="Copy barcode image"><i class="bi bi-clipboard2"></i> Image</button>
                        <button class="btn btn-outline-light btn-sm btn-copy" id="copyRawUrlBtn" title="Copy raw image URL for use in Excel"><i class="bi bi-link-45deg"></i> Raw URL</button>
                        <button class="btn btn-outline-light btn-sm btn-copy" id="copyLinkBtn" title="Copy shareable URL"><i class="bi bi-share"></i> Share</button>
                        <button class="btn btn-outline-light btn-sm btn-copy" id="copySettingsBtn" title="Copy settings as JSON"><i class="bi bi-braces"></i> JSON</button>
                    </div>
                </div>
                <div class="card-body text-center">
                    <div class="preview-container" id="barcodePreviewContainer">
                        <div id="barcodePlaceholder">
                            <i class="bi bi-upc-scan" style="font-size:3rem;"></i>
                            <div class="placeholder-text">Your barcode will appear here</div>
                        </div>
                        <img id="barcodePreview" alt="Generated barcode (click to copy image)" title="Click to copy image" />
                    </div>
                    <div id="barcodeDataDisplay" class="mt-2 small text-muted" aria-live="polite"></div>
                </div>
            </div>
        </div>

        <!-- Right: Options -->
        <div class="col-lg-4">
            <div class="sticky-top">
                <div class="card barcode-card">
                    <div class="card-header"><h5 class="mb-0">Barcode Options</h5></div>
                    <div class="card-body options-panel">
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="writeText" checked>
                            <label class="form-check-label" for="writeText">Show Text</label>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="centerText" checked>
                            <label class="form-check-label" for="centerText">Center Text</label>
                        </div>

                        <div class="mb-3">
                            <label for="moduleWidth" class="form-label">Module Width: <span id="moduleWidthValue" class="badge bg-secondary badge-setting">0.20</span></label>
                            <input type="range" class="form-range" min="0.1" max="1" step="0.05" id="moduleWidth" value="0.2">
                        </div>
                        <div class="mb-3">
                            <label for="moduleHeight" class="form-label">Module Height: <span id="moduleHeightValue" class="badge bg-secondary badge-setting">15.0</span></label>
                            <input type="range" class="form-range" min="5" max="50" step="1" id="moduleHeight" value="15">
                        </div>
                        <div class="mb-3">
                            <label for="quietZone" class="form-label">Quiet Zone: <span id="quietZoneValue" class="badge bg-secondary badge-setting">4.0</span></label>
                            <input type="range" class="form-range" min="1" max="20" step="0.5" id="quietZone" value="4">
                        </div>
                        <div class="mb-3">
                            <label for="fontSize" class="form-label">Font Size: <span id="fontSizeValue" class="badge bg-secondary badge-setting">10</span></label>
                            <input type="range" class="form-range" min="6" max="36" step="1" id="fontSize" value="10">
                        </div>
                        <div class="mb-3">
                            <label for="textDistance" class="form-label">Text Distance: <span id="textDistanceValue" class="badge bg-secondary badge-setting">5.0</span></label>
                            <input type="range" class="form-range" min="0" max="20" step="0.5" id="textDistance" value="5">
                        </div>
                        <div class="mb-3">
                            <label for="fontFamily" class="form-label">Font Family</label>
                            <select class="form-select" id="fontFamily">
                                <!-- System Fonts -->
                                <option value="Arial">Arial (System)</option>
                                <!-- Available Fonts from /fonts directory -->
                                <option value="Barlow">Barlow</option>
                                <option value="Courier Prime">Courier Prime</option>
                                <option value="Fira Code">Fira Code (Monospace)</option>
                                <option value="Helvetica">Helvetica</option>
                                <option value="Lato">Lato</option>
                                <option value="Open Sans">Open Sans</option>
                                <option value="Times New Roman">Times New Roman</option>
                                <option value="Typo Round Bold" selected>Typo Round Bold</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="foregroundColor" class="form-label">Foreground Color</label>
                            <input type="color" class="form-control form-control-color" id="foregroundColor" value="#000000">
                        </div>
                        <div class="mb-3">
                            <label for="backgroundColor" class="form-label">Background Color</label>
                            <input type="color" class="form-control form-control-color" id="backgroundColor" value="#FFFFFF">
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(() => {
  const state = { currentBarcode: null };
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));

  function updateRangeLabel(inputEl) {
    const valueSpan = document.getElementById(`${inputEl.id}Value`);
    if (!valueSpan) return;
    const id = inputEl.id;
    const v = parseFloat(inputEl.value);
    if (id === 'moduleWidth') valueSpan.textContent = v.toFixed(2);
    else if (["moduleHeight","quietZone","textDistance"].includes(id)) valueSpan.textContent = v.toFixed(1);
    else valueSpan.textContent = String(inputEl.value);
  }

  function setDefaultsFor() {
    $('#moduleWidth').value = '0.2';
    $('#moduleHeight').value = '15';
    $('#quietZone').value = '4';
    $('#fontSize').value = '10';
    $('#textDistance').value = '5';
    ['moduleWidth','moduleHeight','quietZone','fontSize','textDistance'].forEach(id => updateRangeLabel(document.getElementById(id)));
  }

  function gatherOptions() {
    return {
      write_text: $('#writeText').checked,
      center_text: $('#centerText').checked,
      module_width: $('#moduleWidth').value,
      module_height: $('#moduleHeight').value,
      quiet_zone: $('#quietZone').value,
      font_size: $('#fontSize').value,
      font_family: $('#fontFamily').value,
      text_distance: $('#textDistance').value,
      foreground: $('#foregroundColor').value,
      background: $('#backgroundColor').value
    };
  }

  async function generateBarcode() {
    const data = $('#barcodeData').value.trim();
    if (!data) { showToast('Please enter data for the barcode'); return; }

    const previewContainer = $('#barcodePreviewContainer');
    const img = $('#barcodePreview');
    previewContainer.classList.remove('has-barcode');
    img.style.display = 'none';

    const opts = gatherOptions();
    const params = new URLSearchParams({ data, type: 'code128', ...opts });

    try {
      const res = await fetch(`/api/barcode?${params.toString()}`);
      if (!res.ok) {
        const errorData = await res.json().catch(() => ({}));
        throw new Error(errorData?.message || 'Failed to generate barcode');
      }
      const result = await res.json();
      img.src = result.barcode;
      img.alt = `Barcode: ${result.barcode_type?.toUpperCase() || 'CODE128'} - ${result.data}`;
      $('#barcodeDataDisplay').textContent = `Type: ${result.barcode_type?.toUpperCase() || 'CODE128'}, Data: ${result.data}`;
      previewContainer.classList.add('has-barcode');
      img.style.display = 'block';

      state.currentBarcode = { type: result.barcode_type || 'code128', data: result.data, imageData: result.barcode, settings: result.options || opts };
    } catch (err) {
      console.error(err);
      showToast(err.message || 'Error generating barcode');
    }
  }

  async function copyImage() {
    if (!state.currentBarcode?.imageData) { showToast('Nothing to copy yet'); return; }
    try {
      const resp = await fetch(state.currentBarcode.imageData);
      const blob = await resp.blob();
      await navigator.clipboard.write([ new ClipboardItem({ [blob.type]: blob }) ]);
      showToast('Barcode image copied');
    } catch (e) { console.error(e); showToast('Failed to copy image'); }
  }

  function copyRawUrl() {
    if (!state.currentBarcode?.data) {
      showToast('No barcode data to generate URL');
      return;
    }

    try {
      const url = buildUrl('/api/barcode', window.location.origin, true);
      navigator.clipboard.writeText(url.toString())
        .then(() => showToast('API URL copied'))
        .catch(() => showToast('Failed to copy URL'));
    } catch (e) {
      console.error('Error generating API URL:', e);
      showToast('Error generating URL');
    }
  }

  function copyLink() {
    if (!state.currentBarcode) { showToast('Nothing to copy yet'); return; }
    try {
      const url = buildUrl(window.location.href.split('?')[0], null, false);
      navigator.clipboard.writeText(url.toString())
        .then(() => showToast('Shareable link copied'))
        .catch(() => showToast('Failed to copy link'));
    } catch (e) {
      console.error('Error generating shareable link:', e);
      showToast('Error generating link');
    }
  }

  function buildUrl(path, origin, isRaw) {
    const url = new URL(path, origin || window.location.origin);
    url.searchParams.set('type', state.currentBarcode.type);
    url.searchParams.set('data', state.currentBarcode.data);
    const settings = state.currentBarcode.settings || {};
    Object.entries(settings).forEach(([key, value]) => {
      if (value !== undefined && value !== null) {
        url.searchParams.set(key, value);
      }
    });
    if (isRaw) url.searchParams.set('raw', 'true');
    return url;
  }

  function copySettingsJSON() {
    if (!state.currentBarcode) { showToast('Nothing to copy yet'); return; }
    const payload = { type: state.currentBarcode.type, data: state.currentBarcode.data, ...state.currentBarcode.settings };
    navigator.clipboard.writeText(JSON.stringify(payload, null, 2)).then(() => showToast('Settings copied')).catch(() => showToast('Failed to copy settings'));
  }

  async function hydrateFromURL() {
    const params = new URLSearchParams(window.location.search);
    const data = params.get('data') || 'CODE128';
    setDefaultsFor();
    $('#barcodeData').value = data;

    params.forEach((value, key) => {
      if (['type','data'].includes(key)) return;
      const el = document.getElementById(key);
      if (!el) return;
      if (el.type === 'checkbox') el.checked = (value === 'true');
      else el.value = value;
      if (el.type === 'range') updateRangeLabel(el);
    });

    await generateBarcode();
  }

  document.addEventListener('DOMContentLoaded', () => {
    $$('#moduleWidth, #moduleHeight, #quietZone, #fontSize, #textDistance').forEach(el => {
      updateRangeLabel(el);
      el.addEventListener('input', () => updateRangeLabel(el));
    });

    $('#btnGenerate').addEventListener('click', generateBarcode);

    $('#barcodePreview').addEventListener('click', copyImage);
    $('#copyBarcodeBtn').addEventListener('click', copyImage);
    $('#copyRawUrlBtn').addEventListener('click', copyRawUrl);
    $('#copyLinkBtn').addEventListener('click', copyLink);
    $('#copySettingsBtn').addEventListener('click', copySettingsJSON);

    $('#btnReset').addEventListener('click', async () => {
      history.replaceState({}, '', window.location.pathname);
      setDefaultsFor();
      $('#barcodeData').value = 'CODE128';
      $('#writeText').checked = true;
      $('#centerText').checked = true;
      $('#foregroundColor').value = '#000000';
      $('#backgroundColor').value = '#FFFFFF';
      await generateBarcode();
      showToast('Reset to defaults');
    });

    hydrateFromURL();
  });
})();
</script>
{% endblock %}
