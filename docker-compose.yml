version: '3.8'

services:
  web:
    build: .
    platform: linux/amd64  # Ensure Linux container is used on Windows
    ports:
      - "6400:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - PYTHONFAULTHANDLER=1
      - LOG_LEVEL=DEBUG
    volumes:
      # For Windows, use the full path for the volume
      - ${PWD}:/app
      # Mount the docker.sock to allow container management from within the container
      - /var/run/docker.sock:/var/run/docker.sock
      # Ensure logs are persisted
      - ./logs:/var/log/breadhub
    # Use a simple Python command that works on Windows
    command: python -m flask run --host=0.0.0.0 --port=5000 --reload

