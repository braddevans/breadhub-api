services:
  web:
    image: python:3.14-slim
    platform: linux/amd64  # Ensure Linux container is used on Windows
    ports:
      - "6400:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONFAULTHANDLER=1
      - LOG_LEVEL=INFO
      - LOG_DIR=/var/log/breadhub
      - PYTHONPATH=/app
      # Worker/thread counts default to the values in gunicorn.conf.py
      # - GUNICORN_WORKERS=4
      # - GUNICORN_THREADS=4
      # Threads per worker that decode image grid uploads (default: min(4, CPUs))
      # - IMAGEGRID_THREADS=4
    volumes:
      # For Windows, use the full path for the volume
      - ${PWD}:/app
      # Ensure logs are persisted
      - ./logs:/var/log/breadhub
    working_dir: /app
    # Install dependencies and run Gunicorn; settings live in gunicorn.conf.py
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      gunicorn wsgi:app"
