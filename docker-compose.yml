version: '3.8'

services:
  web:
    build: .
    platform: linux/amd64  # Ensure Linux container is used on Windows
    ports:
      - "6400:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - PYTHONFAULTHANDLER=1
      - LOG_LEVEL=DEBUG
    volumes:
      # For Windows, use the full path for the volume
      - ${PWD}:/app
      # Mount the docker.sock to allow container management from within the container
      - /var/run/docker.sock:/var/run/docker.sock
      # Ensure logs are persisted
      - ./logs:/var/log/breadhub
    # Use Gunicorn in production with proper worker configuration
    command: >
      sh -c "for i in $(seq 1 5); do
        GUNICORN_WORKER_ID=worker-$i gunicorn \
          --bind 0.0.0.0:5000 \
          --worker-class sync \
          --workers 4 \
          --threads 4 \
          --timeout 120 \
          --worker-tmp-dir /dev/shm \
          --capture-output \
          --enable-stdio-inheritance \
          --log-level info \
          --access-logfile - \
          --error-logfile - \
          --preload \
          wsgi:app \
        &
      done \
      && wait"

